name: Product Test Agent Release

on:
  push:
    branches:
      - main
    paths:
      - "tools/product_test_agent.py"
      - "tools/kaspi_fast_dumping_scanner.py"
      - "tools/kaspi_fast_dumping_session.py"
      - "tools/product_discovery/**"
      - "tools/ozon_http/**"
      - ".github/workflows/product-test-agent-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-test-agent-release
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install standalone dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install httpx curl_cffi Pillow pyinstaller tzdata

      - name: Verify isolated imports
        shell: pwsh
        run: |
          python -c "import tools.product_test_agent; import tools.product_discovery.runtime; import tools.ozon_http"
          @'
          import ast
          from pathlib import Path

          forbidden_roots = {"backend", "sqlalchemy", "playwright"}
          paths = [Path("tools/product_test_agent.py")]
          paths.extend(Path("tools/product_discovery").glob("*.py"))
          paths.extend(
              path for path in Path("tools/ozon_http").glob("*.py")
              if path.name != "adapter.py"
          )
          for path in paths:
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              imported = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imported.update(alias.name for alias in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      imported.add(node.module)
              violations = sorted(
                  module for module in imported
                  if module.split(".", 1)[0] in forbidden_roots
              )
              if violations:
                  raise AssertionError(f"{path} imports forbidden dependencies: {violations}")
          '@ | python -

      - name: Build standalone executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name LEO-Product-Test-Agent `
            --paths . `
            --hidden-import tools.product_test_agent `
            --hidden-import tools.kaspi_fast_dumping_scanner `
            --hidden-import tools.kaspi_fast_dumping_session `
            --collect-submodules tools.product_discovery `
            --hidden-import tools.ozon_http.resolver `
            --hidden-import tools.ozon_http.session_store `
            --hidden-import tools.ozon_http.session_profile `
            --hidden-import tools.ozon_http.session_client `
            --collect-submodules curl_cffi `
            --collect-submodules PIL `
            --collect-submodules httpx `
            --collect-all tzdata `
            tools/product_test_agent.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/LEO-Product-Test-Agent.exe")) {
            throw "LEO-Product-Test-Agent.exe was not created"
          }
          $size = (Get-Item "dist/LEO-Product-Test-Agent.exe").Length
          if ($size -lt 1000000) {
            throw "Packaged executable is unexpectedly small: $size bytes"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEO-Product-Test-Agent-Windows
          path: dist/LEO-Product-Test-Agent.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f product-test-agent-latest $env:GITHUB_SHA
          git push origin refs/tags/product-test-agent-latest --force
          gh release view product-test-agent-latest *> $null
          $notes = "LEO Product Test Agent 1.0.6: ручная Ozon-ссылка стала точным источником цены и доставки; первый Kaspi process сразу отправляет preOrder минимум 1 день; перед выгрузкой CRM показывает план цены и предзаказа."
          if ($LASTEXITCODE -ne 0) {
            gh release create product-test-agent-latest `
              --target "$env:GITHUB_SHA" `
              --title "LEO Product Test Agent" `
              --notes $notes
          } else {
            gh release edit product-test-agent-latest `
              --target "$env:GITHUB_SHA" `
              --title "LEO Product Test Agent" `
              --notes $notes
          }
          gh release upload product-test-agent-latest "dist/LEO-Product-Test-Agent.exe" --clobber
