name: Apply purchase arrival model

on:
  push:
    paths:
      - .github/workflows/apply-purchase-arrival-model.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply arrival model
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('backend/app/purchase_service.py')
          text = service.read_text(encoding='utf-8')
          text = text.replace('from .models import MarketplaceOrder, MarketplaceRawPayload, OutboxEvent, Product\n', 'from .inventory_models import InventoryBatch\nfrom .inventory_service import reconcile_product_orders_from_batch\nfrom .models import MarketplaceOrder, MarketplaceRawPayload, OutboxEvent, Product\n')
          marker = '    previous_status = purchase.status\n'
          insertion = '''    created_batches: list[int] = []
    allocated_to_orders = 0
    if target_status == PurchaseStatus.RECEIVED.value:
        received_at = datetime.now(UTC)
        metadata_payload = dict(metadata or {})
        source_name = str(metadata_payload.get("source_name") or "").strip() or None
        reference = str(metadata_payload.get("reference") or "").strip() or None
        for line in purchase.lines:
            if line.product_id is None:
                continue
            quantity = int(line.received_quantity or line.quantity or 0)
            if quantity <= 0:
                continue
            batch = InventoryBatch(
                product_id=line.product_id,
                received_at=received_at,
                quantity_received=quantity,
                quantity_remaining=quantity,
                unit_cost=line.expected_unit_cost or 0,
                is_received=True,
                source_name=source_name,
                reference=reference,
                note=f"Автоматически создано из закупки {purchase.id}",
            )
            session.add(batch)
            session.flush()
            created_batches.append(batch.id)
            allocated_to_orders += reconcile_product_orders_from_batch(
                session,
                batch=batch,
                allocated_at=received_at,
            )

'''
          if insertion not in text:
              if marker not in text:
                  raise SystemExit('purchase transition marker not found')
              text = text.replace(marker, insertion + marker)
          text = text.replace('        event_metadata["receipt_mode"] = "complete_purchase"\n', '        event_metadata["receipt_mode"] = "complete_purchase"\n        event_metadata["inventory_batch_ids"] = created_batches\n        event_metadata["allocated_to_orders"] = allocated_to_orders\n')
          text = text.replace('                "legacy_receipt_repaired": legacy_receipt_repaired,\n', '                "legacy_receipt_repaired": legacy_receipt_repaired,\n                "inventory_batch_ids": created_batches,\n                "allocated_to_orders": allocated_to_orders,\n')
          service.write_text(text, encoding='utf-8')

          api = Path('backend/app/purchase_api.py')
          text = api.read_text(encoding='utf-8')
          text = text.replace('    metadata: dict | None = None\n', '    metadata: dict | None = None\n')
          api.write_text(text, encoding='utf-8')

          tests = Path('tests/test_purchase_service.py')
          if not tests.exists():
              tests.write_text('''from pathlib import Path\n\n\ndef test_purchase_receive_creates_inventory_and_reconciles_orders() -> None:\n    source = Path("backend/app/purchase_service.py").read_text(encoding="utf-8")\n    assert "InventoryBatch(" in source\n    assert "reconcile_product_orders_from_batch" in source\n    assert '"inventory_batch_ids"' in source\n    assert '"allocated_to_orders"' in source\n''', encoding='utf-8')
          else:
              current = tests.read_text(encoding='utf-8')
              snippet = '''\n\ndef test_purchase_receive_creates_inventory_and_reconciles_orders_contract() -> None:\n    from pathlib import Path\n    source = Path("backend/app/purchase_service.py").read_text(encoding="utf-8")\n    assert "InventoryBatch(" in source\n    assert "reconcile_product_orders_from_batch" in source\n    assert '"inventory_batch_ids"' in source\n    assert '"allocated_to_orders"' in source\n'''
              if 'test_purchase_receive_creates_inventory_and_reconciles_orders_contract' not in current:
                  tests.write_text(current + snippet, encoding='utf-8')

          workflow = Path('.github/workflows/apply-purchase-arrival-model.yml')
          workflow.unlink()
          PY
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Run focused tests
        run: python -m pytest -q tests/test_commerce_core.py tests/test_purchase_service.py
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/purchase_service.py backend/app/purchase_api.py tests/test_purchase_service.py .github/workflows/apply-purchase-arrival-model.yml
          git commit -m "feat: create inventory only when purchase arrives"
          git push origin HEAD:main
