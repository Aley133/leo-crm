name: Kaspi Competitor Agent Release

on:
  push:
    branches:
      - main
    paths:
      - "tools/kaspi_competitor_agent.py"
      - "tools/kaspi_competitor_scanner.py"
      - ".github/workflows/kaspi-competitor-agent-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kaspi-competitor-agent-release
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install standalone dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install httpx pyinstaller

      - name: Verify isolated agent import
        shell: pwsh
        run: |
          python -c "import tools.kaspi_competitor_agent; import tools.kaspi_competitor_scanner"
          @'
          import ast
          from pathlib import Path

          forbidden_roots = {
              "backend",
              "sqlalchemy",
              "playwright",
          }
          forbidden_modules = {
              "tools.browser_agent",
              "tools.browser_agent_desktop",
          }

          for path in (
              Path("tools/kaspi_competitor_agent.py"),
              Path("tools/kaspi_competitor_scanner.py"),
          ):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              imported = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imported.update(alias.name for alias in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      imported.add(node.module)

              violations = sorted(
                  module
                  for module in imported
                  if module.split(".", 1)[0] in forbidden_roots
                  or module in forbidden_modules
              )
              if violations:
                  raise AssertionError(
                      f"{path} imports forbidden runtime dependencies: {violations}"
                  )
          '@ | python -

      - name: Build standalone executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name LEO-Kaspi-Competitor-Agent `
            --paths . `
            --hidden-import tools.kaspi_competitor_scanner `
            --collect-submodules httpx `
            tools/kaspi_competitor_agent.py

      - name: Verify executable was created
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/LEO-Kaspi-Competitor-Agent.exe")) {
            throw "LEO-Kaspi-Competitor-Agent.exe was not created"
          }
          $size = (Get-Item "dist/LEO-Kaspi-Competitor-Agent.exe").Length
          if ($size -lt 1000000) {
            throw "Packaged executable is unexpectedly small: $size bytes"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEO-Kaspi-Competitor-Agent-Windows
          path: dist/LEO-Kaspi-Competitor-Agent.exe
          if-no-files-found: error
          retention-days: 30

      - name: Move rolling tag to current commit
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f kaspi-competitor-agent-latest $env:GITHUB_SHA
          git push origin refs/tags/kaspi-competitor-agent-latest --force

      - name: Create or update rolling GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view kaspi-competitor-agent-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create kaspi-competitor-agent-latest `
              --target "$env:GITHUB_SHA" `
              --title "LEO Kaspi Competitor Agent" `
              --notes "Автономный локальный агент анализа конкурентов Kaspi. Не требует DATABASE_URL, SQLAlchemy, Playwright или LEO Browser Agent. При первом запуске выберите аккаунт CRM (BARWORK или LeoXpress) и введите SERVICE_API_TOKEN из Render. Каждый экземпляр обрабатывает только свой аккаунт."
          } else {
            gh release edit kaspi-competitor-agent-latest `
              --target "$env:GITHUB_SHA" `
              --title "LEO Kaspi Competitor Agent" `
              --notes "Автономный локальный агент анализа конкурентов Kaspi. Не требует DATABASE_URL, SQLAlchemy, Playwright или LEO Browser Agent. При первом запуске выберите аккаунт CRM (BARWORK или LeoXpress) и введите SERVICE_API_TOKEN из Render. Каждый экземпляр обрабатывает только свой аккаунт."
          }
          gh release upload kaspi-competitor-agent-latest "dist/LEO-Kaspi-Competitor-Agent.exe" --clobber
