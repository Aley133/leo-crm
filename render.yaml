services:
  - type: web
    name: leo-crm-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt && alembic upgrade head && python -m tools.ensure_browser_agent_schema
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OZON_CDP_ENDPOINT
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
